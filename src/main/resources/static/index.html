<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#05080f',
                        navy: { 950: '#070d19', 900: '#0b1324', 800: '#111d36', 700: '#1a2c50' }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #05080f; color: #ffffff; }
        .grid-bg {
            background-size: 48px 48px;
            background-image:
                    linear-gradient(to right, rgba(37, 99, 235, 0.06) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(37, 99, 235, 0.06) 1px, transparent 1px);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white grid-bg min-h-screen flex items-center justify-center p-4">

<div class="relative w-full max-w-md">
    <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-blue-600/20 rounded-full blur-[110px] pointer-events-none"></div>

    <div class="relative text-center mb-8">
        <a href="/" class="inline-flex items-center gap-2 font-extrabold text-2xl tracking-tight text-white">
            <span class="w-3 h-3 rounded-sm bg-blue-600 inline-block"></span>
            <span>TaskFlow</span>
        </a>
        <p class="text-sm text-slate-400 mt-2">Manage your day. Ship your work.</p>
    </div>

    <div id="error" class="hidden mb-4 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm"></div>

    <div class="relative bg-navy-900/80 backdrop-blur-xl border border-navy-800 rounded-2xl p-7 shadow-2xl">

        <!-- Login -->
        <div id="login-form">
            <div class="flex items-center gap-2 mb-5">
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                <h2 class="text-lg font-bold text-white">Welcome back</h2>
            </div>
            <form id="login-form-el" class="space-y-3">
                <input type="text" id="login-username" placeholder="Username" required autocomplete="username"
                       class="w-full px-4 py-3 rounded-xl bg-navy-950 border border-navy-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password"
                       class="w-full px-4 py-3 rounded-xl bg-navy-950 border border-navy-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                <button type="submit"
                        class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold transition shadow-lg shadow-blue-600/20">
                    Sign In
                </button>
            </form>
            <p class="text-center text-sm text-slate-400 mt-5">
                Don't have an account?
                <a href="#" id="show-register-link" class="text-blue-400 font-semibold hover:text-blue-300">Sign up</a>
            </p>
        </div>

        <!-- Register -->
        <div id="register-form" class="hidden">
            <div class="flex items-center gap-2 mb-5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <h2 class="text-lg font-bold text-white">Create account</h2>
            </div>
            <form id="register-form-el" class="space-y-3">
                <input type="text" id="register-username" placeholder="Username" required autocomplete="username"
                       class="w-full px-4 py-3 rounded-xl bg-navy-950 border border-navy-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                <input type="password" id="register-password" placeholder="Password (min. 6 chars)" required minlength="6" autocomplete="new-password"
                       class="w-full px-4 py-3 rounded-xl bg-navy-950 border border-navy-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                <button type="submit"
                        class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold transition shadow-lg shadow-blue-600/20">
                    Create Account
                </button>
            </form>
            <p class="text-center text-sm text-slate-400 mt-5">
                Already have an account?
                <a href="#" id="show-login-link" class="text-blue-400 font-semibold hover:text-blue-300">Sign in</a>
            </p>
        </div>
    </div>

    <p class="text-center text-xs text-slate-500 mt-6 font-mono">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 align-middle mr-1"></span>
        Secure • JWT Protected • Self-Hosted
    </p>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
