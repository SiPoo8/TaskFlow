<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — My Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#05080f',
                        navy: { 950: '#070d19', 900: '#0b1324', 800: '#111d36', 700: '#1a2c50' }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #05080f; color: #ffffff; }
        .grid-bg {
            background-size: 48px 48px;
            background-image:
                    linear-gradient(to right, rgba(37, 99, 235, 0.06) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(37, 99, 235, 0.06) 1px, transparent 1px);
        }
        .hidden { display: none !important; }

        /* Modal animation */
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-animate { animation: modalIn 0.18s ease-out; }
    </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white grid-bg min-h-screen">

<header class="sticky top-0 z-40 backdrop-blur-xl bg-obsidian/85 border-b border-navy-800/80">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
        <a href="/tasks.html" class="font-extrabold text-lg tracking-tight text-white flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-sm bg-blue-600 inline-block"></span>
            <span>TaskFlow</span>
        </a>
        <div class="flex items-center gap-3">
        <span class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-navy-900 border border-navy-700 text-xs font-semibold text-slate-300">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="font-mono">@</span><span id="user-name-text"></span>
        </span>
            <button id="logout-btn"
                    class="px-4 py-2 rounded-lg bg-navy-900 border border-navy-700 hover:border-red-500/50 hover:text-red-400 text-slate-300 text-sm font-semibold transition">
                Sign out
            </button>
        </div>
    </div>
</header>

<main class="max-w-4xl mx-auto px-6 py-10">
    <div class="mb-8">
        <span class="text-xs font-bold uppercase tracking-widest text-blue-400">Workspace</span>
        <h1 class="text-3xl md:text-4xl font-extrabold text-white mt-2">My Tasks</h1>
        <p class="text-slate-400 text-sm mt-2">
            Stay focused. One task at a time.
            <span class="text-blue-400/70 font-medium">• Double-click a task to mark as done</span>
        </p>
    </div>

    <div id="error" class="hidden mb-5 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm"></div>

    <form id="add-form"
          class="mb-8 p-5 rounded-2xl bg-navy-900/70 border border-navy-800 grid grid-cols-1 md:grid-cols-[1fr_1fr_auto] gap-3 items-start">
        <input type="text" id="task-title" placeholder="What needs to be done?" required
               class="px-4 py-3 rounded-xl bg-navy-950 border border-navy-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
        <textarea id="task-description" placeholder="Description (optional)" rows="1"
                  class="px-4 py-3 rounded-xl bg-navy-950 border border-navy-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition resize-none"></textarea>
        <button type="submit"
                class="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold transition shadow-lg shadow-blue-600/20">
            + Add Task
        </button>
    </form>

    <ul id="task-list" class="space-y-3"></ul>

    <div id="empty-state" class="hidden text-center py-16 px-6 rounded-2xl bg-navy-900/40 border border-dashed border-navy-700">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600/10 border border-blue-500/30 mb-4">
            <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
        </div>
        <h3 class="text-lg font-bold text-white">No tasks yet</h3>
        <p class="text-sm text-slate-400 mt-1">Add your first task above to get started.</p>
    </div>

    <div id="loading" class="text-center py-8 text-slate-500 text-sm font-mono">
        <span class="inline-block animate-pulse">Loading tasks…</span>
    </div>
</main>

<!-- 🗑 DELETE CONFIRM MODAL -->
<div id="delete-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-obsidian/80 backdrop-blur-md p-4">
    <div class="modal-animate relative bg-navy-900 border border-navy-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl shadow-black/50">

        <!-- Icon -->
        <div class="mx-auto w-14 h-14 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M10 11v6 M14 11v6"/>
            </svg>
        </div>

        <!-- Text -->
        <h3 class="text-lg font-bold text-white text-center">Delete this task?</h3>
        <p class="text-sm text-slate-400 text-center mt-1.5">
            <span id="delete-task-title" class="text-slate-200 font-semibold break-words"></span>
        </p>
        <p class="text-xs text-slate-500 text-center mt-2">This action cannot be undone.</p>

        <!-- Buttons -->
        <div class="flex gap-3 mt-6">
            <button id="delete-cancel" type="button"
                    class="flex-1 px-4 py-2.5 rounded-xl bg-navy-950 border border-navy-700 text-slate-300 text-sm font-semibold hover:text-white hover:border-navy-600 transition cursor-pointer">
                Cancel
            </button>
            <button id="delete-confirm" type="button"
                    class="flex-1 px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-sm font-semibold transition shadow-lg shadow-red-600/20 cursor-pointer">
                Delete
            </button>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/tasks.js"></script>
</body>
</html>
